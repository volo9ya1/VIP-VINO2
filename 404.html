<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена | VIP VINO</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <style>
        /* Полноэкранный режим без шапки, подвала и прокрутки */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Живая золотая геометрическая сеть на фоне (как на референсе, но в цветах VIP VINO) */
        #wineNetworkCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Центральный блок по примеру референса в фирменной стеклянной карточке */
        .error-wrapper {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 45px 35px;
            max-width: 520px;
            width: 90%;
            background: rgba(255, 253, 228, 0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--gold-color, #d4af37);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(74, 21, 27, 0.15);
            user-select: none;
        }

        /* Огромные цифры 404 в винно-золотом исполнении */
        .error-code {
            font-family: 'Playfair Display', serif;
            font-size: clamp(6rem, 20vw, 9.5rem);
            font-weight: 700;
            line-height: 0.95;
            color: var(--wine-color, #4a151b);
            text-shadow: 
                0 4px 20px rgba(212, 175, 55, 0.45),
                0 0 40px rgba(114, 47, 55, 0.15);
            letter-spacing: 4px;
            margin-bottom: 14px;
            position: relative;
        }

        .error-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 700;
            color: var(--wine-color, #4a151b);
            margin-bottom: 8px;
        }

        .error-subtitle {
            font-size: clamp(0.95rem, 3vw, 1.05rem);
            color: #4a3b3c;
            margin-bottom: 26px;
            line-height: 1.5;
        }

        .error-wrapper .btn-primary {
            display: inline-block;
            text-decoration: none;
            padding: 12px 32px;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Анимированная винно-золотая паутина на фоне -->
    <canvas id="wineNetworkCanvas"></canvas>

    <!-- Центральный блок 404 без шапки и подвала -->
    <div class="error-wrapper glass-card">
        <div class="error-code">404</div>
        <div class="error-title">Упс!</div>
        <div class="error-subtitle">К сожалению, запрашиваемая страница не найдена.</div>
        <a href="index.html" class="btn-primary">Вернуться на главную</a>
    </div>

    <script>
        const canvas = document.getElementById('wineNetworkCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, particles;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', () => {
            resize();
            initParticles();
        });

        function initParticles() {
            const count = Math.min(Math.floor((width * height) / 14000), 80);
            particles = [];
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.55,
                    vy: (Math.random() - 0.5) * 0.55,
                    radius: Math.random() * 2.2 + 1
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            // Мягкое золотистое свечение по центру за карточкой
            const gradient = ctx.createRadialGradient(
                width / 2, height / 2, 10,
                width / 2, height / 2, Math.max(width, height) * 0.45
            );
            gradient.addColorStop(0, 'rgba(212, 175, 55, 0.22)');
            gradient.addColorStop(1, 'rgba(114, 47, 55, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > width) p.vx *= -1;
                if (p.y < 0 || p.y > height) p.vy *= -1;

                // Точки-узлы винно-золотого оттенка
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(114, 47, 55, 0.55)';
                ctx.fill();

                for (let j = i + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dx = p.x - p2.x;
                    const dy = p.y - p2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 145) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        const opacity = (1 - dist / 145) * 0.45;
                        ctx.strokeStyle = `rgba(184, 134, 11, ${opacity})`;
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(draw);
        }

        resize();
        initParticles();
        draw();
    </script>
</body>
</html>
