<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP VINO — Каталог вин</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Шапка сайта -->
    <header class="header">
        <div class="header-content">
            <nav class="nav-menu">
                <a href="index.html" class="nav-link">Главная</a>
                <a href="catalog.html" class="nav-link">Весь каталог</a>
                <a href="wine.html" class="nav-link active">Вина</a>
                <a href="sparkling.html" class="nav-link">Шампанское</a>
<a href="tel:+998909285688" style="color: var(--gold-color); text-decoration: none; font-weight: bold; font-size: 0.9rem;">📞 +998 90 928-56-88</a>
            </nav>
        </div>
    </header>

    <!-- Основной контент каталога вин -->
    <main class="main-container">
        <section class="page-title-section">
            <p class="subtitle">Итальянские традиции с 2006 года</p>
            <h1>Каталог вин</h1>
            <p class="description">Выберите изысканные напитки для вашего ассортимента.</p>
        </section>

        <!-- Контейнер для карточек товаров -->
        <div id="catalogContainer" class="catalog-grid"></div>
    </main>

    <!-- Плавающая кнопка корзины -->
    <div id="cartTrigger" class="floating-cart-btn">
        🛒 <span id="cartCount">0</span>
    </div>

    <!-- Модальное окно корзины -->
    <div id="cartModal" class="modal hidden-content">
        <div class="glass-card modal-content">
            <button id="closeCartBtn" class="close-btn">&times;</button>
            <h2>Ваша корзина</h2>
            
            <div id="cartItemsList" class="cart-items-container"></div>

            <div class="cart-total">
                Итого: <span id="cartTotalPrice">0</span> сум
            </div>

            <!-- Форма заказа -->
            <div class="checkout-form">
                <div class="form-group">
                    <input type="text" id="storeNameInput" placeholder="Название магазина / точки (необязательно)">
                </div>
                <div class="form-group">
                    <input type="text" id="userPhone" placeholder="Введите номер телефона (+998...) *" required>
                </div>
                <div class="form-group">
                    <input type="text" id="userLocation" placeholder="Ваш адрес / геопозиция (необязательно)">
                </div>
                <button id="checkoutBtn" class="btn-primary w-100">Оформить заказ</button>
            </div>

            <!-- История заказов -->
            <div class="order-history-section">
                <h4>История заказов:</h4>
                <div id="orderHistoryList" class="order-history-list"></div>
            </div>
        </div>
    </div>

    <!-- Подвал -->
    <footer>
        <p>&copy; 2026 VIP VINO. Все права защищены.</p>
        <p class="author">MADE BY KIRILL</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
