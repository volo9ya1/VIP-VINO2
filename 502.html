<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка шлюза — VIP VINO</title>
    <style>
        html {
            background-color: #2d0b0f;
            width: 100%;
        }
        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #4a151b;
            color: #fefefe;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .error-card {
            background: #fffdf8;
            color: #2c2c2c;
            max-width: 480px;
            width: 100%;
            padding: 35px 25px;
            border-radius: 20px;
            border: 2px solid #d4af37;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            text-align: center;
        }
        .error-code {
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            color: #2d0b0f;
            margin: 0;
            line-height: 1;
            font-weight: 700;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            color: #2d0b0f;
            font-size: 1.6rem;
            margin: 15px 0;
        }
        p {
            color: #555;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .btn-home {
            display: inline-block;
            background: #4a151b;
            color: #f3e5ab;
            text-decoration: none;
            font-weight: 600;
            padding: 11px 24px;
            border-radius: 8px;
            border: 1px solid #d4af37;
            transition: all 0.3s ease;
        }
        .btn-home:hover {
            background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
            color: #2d0b0f;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body>

    <div class="error-card">
        <div class="error-code">502</div>
        <h1>Ошибка шлюза доставки</h1>
        <p>Серверы временно не могут синхронизировать данные оптового каталога. Официант уже выясняет детали на складе, попробуйте обновить страницу.</p>
        <a href="index.html" class="btn-home">Вернуться на главную</a>
    </div>

</body>
</html>
